# pokemon.familie-kosmol.de – statische PWA (v3). Ziel: /etc/nginx/sites-available/pokemon
# App aus dist/ und Assets aus generated/ liegen gemeinsam in /var/www/pokemon-entdecker.
server {
    server_name pokemon.familie-kosmol.de;
    root /var/www/pokemon-entdecker;
    index index.html;

    # Privates Familienprojekt: nicht in Suchmaschinen (Header wird in Locations mit add_header wiederholt)
    add_header X-Robots-Tag "noindex, nofollow" always;

    # App-Shell und Service Worker immer frisch, damit Updates auf den Tablets ankommen
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Robots-Tag "noindex, nofollow" always;
    }
    location = /sw.js {
        add_header Cache-Control "no-cache";
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # Gehashte Build-Dateien ändern sich nie
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # Daten neu prüfen, Bilder/Audio eine Woche (offline übernimmt ohnehin der Service Worker)
    location /data/ {
        add_header Cache-Control "no-cache";
        add_header X-Robots-Tag "noindex, nofollow" always;
    }
    location ~ ^/(img|audio)/ {
        add_header Cache-Control "public, max-age=604800";
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/pokemon.familie-kosmol.de/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/pokemon.familie-kosmol.de/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = pokemon.familie-kosmol.de) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name pokemon.familie-kosmol.de;
    return 404; # managed by Certbot
}
