# Drucken vom Kinder-Tablet über Home Assistant – Vorlage für die eigene HA-Instanz.
#
# Weg: App (Druck-Code) → POST /api/print auf dem Server → nginx prüft den Code und reicht an den
# HA-Webhook weiter (infra/nginx-pokemon-print.conf.example) → Automation unten → shell_command →
# IPP-Druckauftrag (fertig erzeugt von pipeline/printsheet.py, liegt unter /print/<key>.ipp) direkt an
# den Drucker. Der HP Officejet Pro 8600 nimmt image/jpeg per IPP an, CUPS ist nicht nötig.

# ── 1. configuration.yaml (YAML-only, danach HA neu starten) ─────────────────────────────────────
shell_command:
  # $1 = Bild-Schlüssel (Pokédex-Nummer oder Form), $2 = Drucker-IP
  pokemon_ausmalbild_drucken: >-
    sh -c 'curl -sf --max-time 30 "https://pokemon.familie-kosmol.de/print/$1.ipp"
    | curl -sf --max-time 90 -H "Content-Type: application/ipp" --data-binary @- -o /dev/null
    "http://$2:631/ipp/printer"' pokemon {{ key }} {{ printer }}

# ── 2. Zähler (UI-Helfer): counter.pokemon_ausmalbilder_heute, Minimum 0, Schritt 1 ─────────────

